name: CI

on:
  push:
    branches: [feature/devops]
  pull_request:
    branches: [feature/devops]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Checkout source code -> Install dependencies -> Test -> Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: express-hello-world:${{ github.sha }}

  notify:
    name: Notify Result
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify success via commit comment
        if: needs.build.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `CI succeeded for commit ${process.env.GITHUB_SHA}.
            Workflow: ${process.env.GITHUB_WORKFLOW}
            Run: ${process.env.GITHUB_RUN_ID}
            See details: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.GITHUB_SHA,
              body
            });

      - name: Notify failure in workflow summary
        if: needs.build.result != 'success'
        run: |
          echo "CI that bai o ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: ${GITHUB_WORKFLOW}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reference: ${GITHUB_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "Thong tin chi tiet: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
